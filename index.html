<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Voz de Manaure - Táctica Elite v23.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --ama: #edb900; --negro: #1a1a1a; --verde: #27ae60; --rojo: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--negro); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .toolbar { background: var(--ama); padding: 8px; display: flex; justify-content: center; gap: 8px; align-items: center; z-index: 100; flex-wrap: wrap; }
        .btn-t { background: black; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn-t.active { background: white; color: black; box-shadow: 0 0 10px white; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid black; }
        .color-dot.selected { border-color: white; transform: scale(1.2); }
        #main-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #canvas-wrapper { position: relative; background: #000; border: 2px solid #555; }
        .modo-youtube { width: 854px; height: 480px; }
        .modo-celular { width: 360px; height: 640px; border: 4px solid var(--ama) !important; }
        #v-tachira { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10; }
        .video-controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); display: flex; padding: 10px; gap: 10px; z-index: 20; align-items: center; box-sizing: border-box; flex-wrap: wrap; }
        input[type=range] { flex-grow: 1; cursor: pointer; accent-color: var(--ama); height: 8px; }
        .speed-label { font-size: 10px; font-weight: bold; color: var(--ama); }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="video/*" style="display:none" onchange="handleFile(event)">
    <button class="btn-t" style="background:var(--verde)" onclick="document.getElementById('file-input').click()">📁 VIDEO</button>
    
    <div style="display:flex; gap:5px; padding: 0 10px; border-left: 1px solid rgba(0,0,0,0.2)">
        <div class="color-dot selected" style="background:#edb900" onclick="setColor('#edb900', this)"></div>
        <div class="color-dot" style="background:#e74c3c" onclick="setColor('#e74c3c', this)"></div>
        <div class="color-dot" style="background:#ffffff" onclick="setColor('#ffffff', this)"></div>
    </div>

    <button id="btn-select" class="btn-t tool-btn active" onclick="setMode('select')">🖱️ MOVER</button>
    <button id="btn-pencil" class="btn-t tool-btn" onclick="setMode('pencil')">✏️ LIBRE</button>
    <button id="btn-circle" class="btn-t tool-btn" onclick="setMode('circle')">⭕ ANILLO</button>
    <button id="btn-arrow" class="btn-t tool-btn" onclick="setMode('arrow')">↗️ FLECHA</button>
    <button id="btn-text" class="btn-t tool-btn" onclick="setMode('text')">📝 TEXTO</button>

    <button class="btn-t" style="background:var(--ama); color:black" onclick="takeSnapshot()">📸 FOTO</button>
    <button class="btn-t" style="background:var(--rojo)" onclick="deleteSelected()">🗑️ BORRAR</button>
    |
    <button class="btn-t" onclick="resize('youtube')">📺 YT</button>
    <button class="btn-t" onclick="resize('celular')">📱 MÓVIL</button>
</div>

<div id="main-container">
    <div id="canvas-wrapper" class="modo-youtube">
        <video id="v-tachira" muted playsinline preload="auto"></video>
        <canvas id="tactic-canvas"></canvas>
        <div class="video-controls">
            <button class="btn-t" onclick="togglePlay()" id="play-btn">▶️ PLAY</button>
            
            <div style="display:flex; align-items:center; gap:5px;">
                <span class="speed-label">VEL:</span>
                <button class="btn-t speed-btn" onclick="setSpeed(0.25, this)">0.25x</button>
                <button class="btn-t speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
                <button class="btn-t speed-btn active" onclick="setSpeed(1, this)">1x</button>
            </div>

            <input type="range" id="seek-bar" value="0" step="0.01">
            <span id="time-display" style="font-family: monospace; font-size: 12px; width: 45px;">0:00</span>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('v-tachira');
    const playBtn = document.getElementById('play-btn');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const canvas = new fabric.Canvas('tactic-canvas', { selection: true });
    let currentMode = 'select';
    let currentColor = '#edb900';

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) { video.src = URL.createObjectURL(file); video.pause(); video.currentTime = 0; }
    }

    function togglePlay() { 
        if (video.paused) { video.play(); playBtn.innerText = "⏸️ PAUSA"; }
        else { video.pause(); playBtn.innerText = "▶️ PLAY"; }
    }

    function setSpeed(s, el) {
        video.playbackRate = s;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    seekBar.oninput = function() {
        video.currentTime = (seekBar.value / 100) * video.duration;
    };

    video.ontimeupdate = () => {
        if (!video.duration) return;
        seekBar.value = (video.currentTime / video.duration) * 100;
        let mins = Math.floor(video.currentTime / 60);
        let secs = Math.floor(video.currentTime % 60);
        timeDisplay.innerText = mins + ":" + (secs < 10 ? '0' : '') + secs;
    };

    function setColor(color, el) {
        currentColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');
        const active = canvas.getActiveObject();
        if(active) {
            if(active.type === 'i-text') active.set('fill', color);
            else active.set('stroke', color);
            canvas.renderAll();
        }
    }

    function setMode(m) {
        currentMode = m;
        canvas.isDrawingMode = (m === 'pencil');
        canvas.selection = (m === 'select');
        if(canvas.isDrawingMode) {
            canvas.freeDrawingBrush.width = 5;
            canvas.freeDrawingBrush.color = currentColor;
        }
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
    }

    function deleteSelected() {
        canvas.getActiveObjects().forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject().renderAll();
    }

    function takeSnapshot() {
        const wrap = document.getElementById('canvas-wrapper');
        const temp = document.createElement('canvas');
        temp.width = wrap.clientWidth; temp.height = wrap.clientHeight;
        const ctx = temp.getContext('2d');
        ctx.drawImage(video, 0, 0, temp.width, temp.height);
        ctx.drawImage(canvas.getElement(), 0, 0);
        const link = document.createElement('a');
        link.download = 'analisis_manaure.png';
        link.href = temp.toDataURL(); link.click();
    }

    let isDown, origX, origY, activeObj, head;
    canvas.on('mouse:down', function(o) {
        if (currentMode === 'select' || currentMode === 'pencil') return;
        let p = canvas.getPointer(o.e);
        if (currentMode === 'text') {
            const text = new fabric.IText('JUGADOR', { left: p.x, top: p.y, fontSize: 18, fill: currentColor, fontFamily: 'Segoe UI', fontWeight: 'bold' });
            canvas.add(text);
            setMode('select');
            return;
        }
        isDown = true; origX = p.x; origY = p.y;
        if (currentMode === 'circle') {
            activeObj = new fabric.Circle({ left:origX, top:origY, radius:1, stroke:currentColor, strokeWidth:5, fill:'transparent', selectable: true });
            canvas.add(activeObj);
        } else if (currentMode === 'arrow') {
            activeObj = new fabric.Line([origX, origY, origX, origY], { stroke: currentColor, strokeWidth: 6, selectable: true });
            head = new fabric.Triangle({ width:18, height:18, fill:currentColor, originX:'center', originY:'center', selectable: false });
            canvas.add(activeObj, head);
        }
    });

    canvas.on('mouse:move', function(o) {
        if (!isDown) return;
        let p = canvas.getPointer(o.e);
        if (currentMode === 'circle') activeObj.set({ radius: Math.abs(origX - p.x) / 2 });
        else if (currentMode === 'arrow') {
            activeObj.set({ x2: p.x, y2: p.y });
            let ang = Math.atan2(p.y - origY, p.x - origX) * 180 / Math.PI;
            head.set({ left: p.x, top: p.y, angle: ang + 90 });
        }
        canvas.renderAll();
    });

    canvas.on('mouse:up', () => { isDown = false; if(currentMode !== 'pencil') setMode('select'); });

    function resize(m) {
        const wrap = document.getElementById('canvas-wrapper');
        wrap.className = (m === 'youtube') ? 'modo-youtube' : 'modo-celular';
        setTimeout(() => { canvas.setWidth(wrap.clientWidth); canvas.setHeight(wrap.clientHeight); }, 100);
    }

    window.onload = () => { resize('youtube'); setMode('select'); };
</script>
</body>
</html>
