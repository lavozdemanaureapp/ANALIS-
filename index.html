<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador Táctico PRO - Manaure</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .editor-container { position: relative; width: 800px; height: 450px; background: #000; border: 3px solid #edb900; border-radius: 8px; overflow: hidden; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10 !important; }
        .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #222; padding: 15px; border-radius: 12px; width: 770px; }
        .timeline-container { width: 800px; margin-top: 10px; display: flex; gap: 10px; align-items: center; background: #222; padding: 5px 15px; border-radius: 20px; }
        #seekBar { flex-grow: 1; accent-color: #edb900; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 0.9em; transition: 0.2s; }
        button:hover { filter: brightness(1.2); }
        .btn-draw { background: #edb900; color: black; }
        .btn-tool { background: #444; color: white; }
        .btn-export { background: #28a745; color: white; grid-column: span 4; margin-top: 5px; }
        select { background: #444; color: white; border: none; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h3 style="margin: 5px; color: #edb900;">ESTACIÓN TÁCTICA 92.3 FM</h3>
    <input type="file" id="fileInput" accept="video/*" style="margin-bottom:10px;">
    
    <div class="editor-container">
        <video id="videoPlayer"></video>
        <canvas id="tacticCanvas"></canvas>
    </div>

    <div class="timeline-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekBar" value="0" step="0.1">
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn-draw" onclick="setMode('arrow')">↗️ Flecha</button>
        <button class="btn-draw" onclick="setMode('circle')">⭕ Círculo</button>
        <button class="btn-draw" onclick="setMode('line')">➖ Línea Ofside</button>
        <button class="btn-draw" onclick="addText()">📝 Texto/Dato</button>
        
        <select id="colorSelect">
            <option value="#edb900">Amarillo (Táchira)</option>
            <option value="#ffffff">Blanco</option>
            <option value="#ff0000">Rojo</option>
        </select>
        
        <button class="btn-tool" onclick="togglePlay()">⏯️ Play/Pausa</button>
        <button class="btn-tool" onclick="deleteSelected()">🗑️ Borrar</button>
        <button class="btn-tool" onclick="canvas.clear()">🧹 Limpiar</button>
        
        <button class="btn-export" onclick="exportImage()">📸 EXPORTAR ANÁLISIS PARA REDES</button>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const canvas = new fabric.Canvas('tacticCanvas');
        canvas.setWidth(800); canvas.setHeight(450);
        let mode = null, isDrawing = false, activeObj, head;

        document.getElementById('fileInput').onchange = (e) => {
            video.src = URL.createObjectURL(e.target.files[0]);
            video.play();
        };

        // Timeline
        video.ontimeupdate = () => {
            seekBar.value = (100 / video.duration) * video.currentTime || 0;
            document.getElementById('currentTime').innerText = formatTime(video.currentTime);
        };
        video.onloadedmetadata = () => document.getElementById('duration').innerText = formatTime(video.duration);
        seekBar.oninput = () => video.currentTime = video.duration * (seekBar.value / 100);
        function formatTime(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        function togglePlay() { video.paused ? video.play() : video.pause(); mode = null; }
        function setMode(m) { mode = m; video.pause(); }

        function addText() {
            const t = new fabric.IText('Dato', { left: 400, top: 225, fontSize: 20, fill: '#fff', backgroundColor: 'rgba(0,0,0,0.6)' });
            canvas.add(t); canvas.setActiveObject(t);
        }

        function deleteSelected() {
            canvas.getActiveObjects().forEach(obj => canvas.remove(obj));
            canvas.discardActiveObject().renderAll();
        }

        canvas.on('mouse:down', function(o) {
            if (!mode) return;
            isDrawing = true;
            const p = canvas.getPointer(o.e);
            const color = document.getElementById('colorSelect').value;

            if (mode === 'arrow' || mode === 'line') {
                activeObj = new fabric.Line([p.x, p.y, p.x, p.y], { stroke: color, strokeWidth: 4 });
                if (mode === 'arrow') head = new fabric.Triangle({ width: 15, height: 15, fill: color, left: p.x, top: p.y, originX: 'center', originY: 'center' });
                canvas.add(activeObj); if(head) canvas.add(head);
            } else if (mode === 'circle') {
                activeObj = new fabric.Circle({ left: p.x, top: p.y, radius: 1, fill: 'transparent', stroke: color, strokeWidth: 3, originX: 'center', originY: 'center' });
                canvas.add(activeObj);
            }
        });

        canvas.on('mouse:move', function(o) {
            if (!isDrawing || !mode) return;
            const p = canvas.getPointer(o.e);
            if (mode === 'arrow' || mode === 'line') {
                activeObj.set({ x2: p.x, y2: p.y });
                if (mode === 'arrow') {
                    const angle = Math.atan2(p.y - activeObj.y1, p.x - activeObj.x1) * 180 / Math.PI;
                    head.set({ left: p.x, top: p.y, angle: angle + 90 });
                }
            } else if (mode === 'circle') {
                activeObj.set({ radius: Math.abs(p.x - activeObj.left) });
            }
            canvas.renderAll();
        });

        canvas.on('mouse:up', () => { isDrawing = false; mode = null; head = null; });

        function exportImage() {
            const temp = document.createElement('canvas');
            temp.width = 800; temp.height = 450;
            const ctx = temp.getContext('2d');
            ctx.drawImage(video, 0, 0, 800, 450);
            ctx.drawImage(canvas.getElement(), 0, 0, 800, 450);
            const link = document.createElement('a');
            link.download = `analisis_manaure_${Date.now()}.png`;
            link.href = temp.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
