<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Voz de Manaure - Táctica Avanzada v31.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --ama: #edb900; --negro: #1a1a1a; --verde: #27ae60; --rojo: rgba(231, 76, 60, 0.4); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--negro); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: var(--ama); padding: 8px; display: flex; justify-content: center; gap: 8px; align-items: center; z-index: 100; flex-wrap: wrap; }
        .btn-t { background: black; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn-t.active { background: white; color: black; border: 1px solid black; }
        #main-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #111; }
        #video-container { position: relative; background: #000; border: 3px solid var(--ama); overflow: hidden; }
        .res-yt { width: 854px; height: 480px; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10; }
        .video-controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); display: flex; padding: 10px; gap: 10px; z-index: 100; align-items: center; box-sizing: border-box; }
        input[type=range] { flex-grow: 1; accent-color: var(--ama); }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="video/*" style="display:none" onchange="handleFile(event)">
    <button class="btn-t" style="background:var(--verde)" onclick="document.getElementById('file-input').click()">📁 VIDEO</button>
    
    <button id="btn-select" class="btn-t tool-btn active" onclick="setMode('select')">🖱️ MOVER</button>
    <button id="btn-arrow" class="btn-t tool-btn" onclick="setMode('arrow')">↗️ FLECHA</button>
    <button id="btn-area" class="btn-t tool-btn" onclick="setMode('area')">🟥 ZONA</button>
    <button id="btn-player" class="btn-t tool-btn" onclick="setMode('player')">👤 JUGADOR</button>

    <button class="btn-t" style="background:#e74c3c" onclick="deleteSelected()">🗑️ BORRAR</button>
</div>

<div id="main-container">
    <div id="video-container" class="res-yt">
        <video id="v-tachira" muted playsinline></video>
        <canvas id="tactic-canvas"></canvas>
        <div class="video-controls">
            <button class="btn-t" onclick="togglePlay()" id="play-btn">▶️</button>
            <button class="btn-t" onclick="video.playbackRate = 0.25">0.25x</button>
            <input type="range" id="seek-bar" value="0" step="0.1">
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('v-tachira');
    const canvas = new fabric.Canvas('tactic-canvas', { width: 854, height: 480 });
    let currentMode = 'select', isDown, origX, origY, activeObj, head, activeGroup;

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) { video.src = URL.createObjectURL(file); video.pause(); canvas.clear(); }
    }

    function togglePlay() { video.paused ? video.play() : video.pause(); }

    function setMode(m) {
        currentMode = m;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
    }

    function deleteSelected() {
        canvas.getActiveObjects().forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject().renderAll();
    }

    canvas.on('mouse:down', function(o) {
        if (currentMode === 'select') return;
        let p = canvas.getPointer(o.e);
        isDown = true; origX = p.x; origY = p.y;

        if (currentMode === 'area') {
            activeObj = new fabric.Rect({ left: p.x, top: p.y, width: 1, height: 1, fill: 'rgba(231, 76, 60, 0.4)', stroke: '#e74c3c', strokeWidth: 2 });
            canvas.add(activeObj);
        } else if (currentMode === 'player') {
            let circle = new fabric.Circle({ radius: 25, stroke: '#edb900', strokeWidth: 3, fill: 'transparent', originX: 'center', originY: 'center' });
            let name = new fabric.IText('JUGADOR', { fontSize: 14, fill: 'white', backgroundColor: 'black', top: 30, originX: 'center' });
            activeGroup = new fabric.Group([circle, name], { left: p.x, top: p.y, originX: 'center', originY: 'center' });
            canvas.add(activeGroup);
            setMode('select');
        } else if (currentMode === 'arrow') {
            let line = new fabric.Line([p.x, p.y, p.x, p.y], { stroke: '#edb900', strokeWidth: 5 });
            head = new fabric.Triangle({ width: 15, height: 15, fill: '#edb900', originX: 'center', originY: 'center', selectable: false });
            activeGroup = new fabric.Group([line, head], { selectable: true });
            canvas.add(activeGroup);
        }
    });

    canvas.on('mouse:move', function(o) {
        if (!isDown || currentMode === 'select') return;
        let p = canvas.getPointer(o.e);

        if (currentMode === 'area') {
            activeObj.set({ width: Math.abs(origX - p.x), height: Math.abs(origY - p.y) });
        } else if (currentMode === 'arrow') {
            let line = activeGroup.item(0);
            line.set({ x2: p.x, y2: p.y });
            let angle = Math.atan2(p.y - origY, p.x - origX) * 180 / Math.PI;
            head.set({ left: p.x, top: p.y, angle: angle + 90 });
            canvas.remove(activeGroup);
            activeGroup = new fabric.Group([line, head], { selectable: true });
            canvas.add(activeGroup);
        }
        canvas.renderAll();
    });

    canvas.on('mouse:up', () => { isDown = false; });
</script>
</body>
</html>
