<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Voz de Manaure - Analizador PRO v32.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --ama: #edb900; --negro: #1a1a1a; --rojo: rgba(231, 76, 60, 0.4); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--negro); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: var(--ama); padding: 10px; display: flex; justify-content: center; gap: 10px; align-items: center; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-t { background: black; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; }
        .btn-t.active { background: white; color: black; box-shadow: 0 0 15px white; }
        .btn-rec { background: #e74c3c; animation: pulse 2s infinite; display: none; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #video-container { position: relative; width: 854px; height: 480px; background: #000; margin: auto; border: 4px solid #333; }
        video { position: absolute; width: 100%; height: 100%; z-index: 1; object-fit: contain; pointer-events: none; }
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10; }
        
        .controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); display: flex; padding: 10px; gap: 15px; z-index: 100; align-items: center; box-sizing: border-box; }
        input[type=range] { flex-grow: 1; accent-color: var(--ama); }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="video/*" style="display:none" onchange="handleFile(event)">
    <button class="btn-t" style="background:#27ae60" onclick="document.getElementById('file-input').click()">📁 CARGAR JUGADA</button>
    
    <button id="btn-select" class="btn-t tool-btn active" onclick="setMode('select')">🖱️ MOVER</button>
    <button id="btn-arrow" class="btn-t tool-btn" onclick="setMode('arrow')">↗️ FLECHA</button>
    <button id="btn-area" class="btn-t tool-btn" onclick="setMode('area')">🟥 ZONA ROJA</button>
    <button id="btn-player" class="btn-t tool-btn" onclick="setMode('player')">👤 JUGADOR</button>

    <button id="rec-btn" class="btn-t" style="background:#c0392b" onclick="toggleRecording()">🔴 GRABAR ANALISIS</button>
    <button class="btn-t" style="background:#444" onclick="deleteSelected()">🗑️ BORRAR</button>
</div>

<div style="flex-grow:1; display:flex;">
    <div id="video-container">
        <video id="v-main" muted playsinline></video>
        <canvas id="t-canvas"></canvas>
        <div class="controls">
            <button class="btn-t" onclick="togglePlay()" id="play-p">▶️</button>
            <button class="btn-t" onclick="v.playbackRate = 0.25">0.25x</button>
            <button class="btn-t" onclick="v.playbackRate = 1">1x</button>
            <input type="range" id="seek" value="0">
        </div>
    </div>
</div>

<script>
    const v = document.getElementById('v-main');
    const canvas = new fabric.Canvas('t-canvas', { width: 854, height: 480 });
    let mode = 'select', isDown, x, y, activeObj, head, recorder, chunks = [];

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) { v.src = URL.createObjectURL(file); v.pause(); canvas.clear(); }
    }

    function togglePlay() { v.paused ? v.play() : v.pause(); }

    function setMode(m) {
        mode = m;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
    }

    function deleteSelected() {
        canvas.getActiveObjects().forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject().renderAll();
    }

    // LÓGICA DE GRABACIÓN
    async function toggleRecording() {
        const btn = document.getElementById('rec-btn');
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            btn.innerText = "🔴 GRABAR ANALISIS";
            btn.style.background = "#c0392b";
        } else {
            chunks = [];
            // Truco técnico: capturamos el video y el canvas juntos
            const stream = canvas.getElement().captureStream(30);
            recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'analisis_manaure.webm'; a.click();
            };
            recorder.start();
            btn.innerText = "⏹️ DETENER Y DESCARGAR";
            btn.style.background = "#222";
        }
    }

    // DIBUJO DE FIGURAS TIPO BRUNO CATIVIOLA
    canvas.on('mouse:down', function(o) {
        if (mode === 'select') return;
        let p = canvas.getPointer(o.e);
        isDown = true; x = p.x; y = p.y;

        if (mode === 'area') {
            activeObj = new fabric.Rect({ left: x, top: y, width: 1, height: 1, fill: 'rgba(231, 76, 60, 0.3)', stroke: '#e74c3c', strokeWidth: 2 });
            canvas.add(activeObj);
        } else if (mode === 'player') {
            let c = new fabric.Circle({ radius: 25, stroke: '#edb900', strokeWidth: 3, fill: 'transparent', originX: 'center' });
            let t = new fabric.IText('NOMBRE', { fontSize: 16, fill: 'white', backgroundColor: 'black', top: 30, originX: 'center', fontFamily: 'Arial' });
            let g = new fabric.Group([c, t], { left: x, top: y, originX: 'center', originY: 'center' });
            canvas.add(g);
            setMode('select');
        } else if (mode === 'arrow') {
            let l = new fabric.Line([x, y, x, y], { stroke: '#edb900', strokeWidth: 5 });
            head = new fabric.Triangle({ width: 15, height: 15, fill: '#edb900', originX: 'center', originY: 'center' });
            activeObj = new fabric.Group([l, head], { selectable: true });
            canvas.add(activeObj);
        }
    });

    canvas.on('mouse:move', function(o) {
        if (!isDown || mode === 'select') return;
        let p = canvas.getPointer(o.e);
        if (mode === 'area') {
            activeObj.set({ width: Math.abs(x - p.x), height: Math.abs(y - p.y) });
        } else if (mode === 'arrow') {
            let l = activeObj.item(0);
            l.set({ x2: p.x, y2: p.y });
            let ang = Math.atan2(p.y - y, p.x - x) * 180 / Math.PI;
            head.set({ left: p.x, top: p.y, angle: ang + 90 });
            canvas.remove(activeObj);
            activeObj = new fabric.Group([l, head], { selectable: true });
            canvas.add(activeObj);
        }
        canvas.renderAll();
    });

    canvas.on('mouse:up', () => isDown = false);
    v.ontimeupdate = () => { document.getElementById('seek').value = (v.currentTime / v.duration) * 100 || 0; };
</script>
</body>
</html>
