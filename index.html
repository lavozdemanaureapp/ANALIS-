<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Voz de Manaure - Panel de Análisis</title>
    <style>
        :root {
            --amarillo: #edb900;
            --negro: #1a1a1a;
            --gris: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--negro);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PANEL DE PRODUCCIÓN (CONTROLES) */
        .panel-superior {
            width: 100%;
            background-color: var(--amarillo);
            color: black;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-formato {
            background-color: black;
            color: var(--amarillo);
        }

        .btn-formato:hover {
            background-color: var(--gris);
        }

        /* CONTENEDOR MAESTRO DEL VIDEO */
        #contenedor-maestro {
            margin: 40px auto;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid var(--gris);
            overflow: hidden;
            position: relative;
        }

        /* CLASES DE TAMAÑO */
        .modo-youtube {
            width: 90%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
        }

        .modo-celular {
            width: 360px; /* Proporcional a 1080 */
            height: 640px; /* Proporcional a 1920 */
            border: 5px solid var(--amarillo) !important;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .info-footer {
            margin-top: 20px;
            text-align: center;
            color: var(--amarillo);
        }
    </style>
</head>
<body>

    <div class="panel-superior">
        <div style="display: flex; align-items: center; gap: 10px;">
            <strong>LA VOZ DE MANAURE 92.3 FM</strong>
        </div>
        |
        <span>FORMATO DE GRABACIÓN:</span>
        <button class="btn-formato" onclick="ajustarLienzo('youtube')">YouTube (16:9)</button>
        <button class="btn-formato" onclick="ajustarLienzo('celular')">Móvil (9:16)</button>
    </div>

    <div id="contenedor-maestro" class="modo-youtube">
        <div id="player">
            <p style="color: #666;">Cargando video de análisis...</p>
        </div>
    </div>

    <div class="info-footer">
        <p>Grabación lista para OBS • Versión de Análisis Táctico v2.0</p>
    </div>

    <script>
        // Función para cambiar el tamaño del archivo único
        function ajustarLienzo(tipo) {
            const lienzo = document.getElementById('contenedor-maestro');
            
            if (tipo === 'youtube') {
                lienzo.classList.remove('modo-celular');
                lienzo.classList.add('modo-youtube');
                console.log("Cambiado a 16:9 Horizontal");
            } else {
                lienzo.classList.remove('modo-youtube');
                lienzo.classList.add('modo-celular');
                console.log("Cambiado a 9:16 Vertical");
            }
        }

        // Aquí iría tu lógica de Firebase que ya tenemos para sincronizar 
        // los videos o las flechas si las manejas por base de datos.
    </script>

</body>
</html>
