<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Voz de Manaure - Táctica Directa v29.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --ama: #edb900; --negro: #1a1a1a; --verde: #27ae60; --rojo: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--negro); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: var(--ama); padding: 8px; display: flex; justify-content: center; gap: 8px; align-items: center; z-index: 100; flex-wrap: wrap; }
        .btn-t { background: black; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn-t.active { background: white; color: black; border: 1px solid black; }
        .color-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid black; }
        .color-dot.selected { border-color: white; transform: scale(1.2); }
        
        #main-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #111; padding: 20px; }
        
        /* Contenedor dinámico para OBS */
        #video-container { position: relative; background: #000; border: 3px solid var(--ama); overflow: hidden; }
        .res-yt { width: 854px; height: 480px; }
        .res-movil { width: 360px; height: 640px; }

        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10; }

        .video-controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); display: flex; padding: 10px; gap: 10px; z-index: 100; align-items: center; box-sizing: border-box; }
        input[type=range] { flex-grow: 1; accent-color: var(--ama); cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="video/*" style="display:none" onchange="handleFile(event)">
    <button class="btn-t" style="background:var(--verde)" onclick="document.getElementById('file-input').click()">📁 VIDEO</button>
    
    <div style="display:flex; gap:5px; padding: 0 10px; border-right: 1px solid rgba(0,0,0,0.2)">
        <div class="color-dot selected" style="background:#edb900" onclick="setColor('#edb900', this)"></div>
        <div class="color-dot" style="background:#e74c3c" onclick="setColor('#e74c3c', this)"></div>
        <div class="color-dot" style="background:#ffffff" onclick="setColor('#ffffff', this)"></div>
    </div>

    <button id="btn-select" class="btn-t tool-btn active" onclick="setMode('select')">🖱️</button>
    <button id="btn-pencil" class="btn-t tool-btn" onclick="setMode('pencil')">✏️</button>
    <button id="btn-circle" class="btn-t tool-btn" onclick="setMode('circle')">⭕</button>
    <button id="btn-arrow" class="btn-t tool-btn" onclick="setMode('arrow')">↗️</button>
    <button id="btn-text" class="btn-t tool-btn" onclick="setMode('text')">TXT</button>

    <button class="btn-t" style="background:var(--rojo)" onclick="deleteSelected()">🗑️ BORRAR</button>
    |
    <button id="res-yt-btn" class="btn-t active" onclick="changeRes('yt')">📺 YT</button>
    <button id="res-movil-btn" class="btn-t" onclick="changeRes('movil')">📱 MÓVIL</button>
</div>

<div id="main-container">
    <div id="video-container" class="res-yt">
        <video id="v-tachira" muted playsinline></video>
        <canvas id="tactic-canvas"></canvas>
        <div class="video-controls">
            <button class="btn-t" onclick="togglePlay()" id="play-btn">▶️ PLAY</button>
            <button class="btn-t" onclick="video.playbackRate = 0.25">0.25x</button>
            <button class="btn-t" onclick="video.playbackRate = 1">1x</button>
            <input type="range" id="seek-bar" value="0" step="0.1">
            <button class="btn-t" style="background:var(--ama); color:black" onclick="takeSnapshot()">📸 FOTO</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('v-tachira');
    const canvas = new fabric.Canvas('tactic-canvas', { width: 854, height: 480 });
    let currentMode = 'select', currentColor = '#edb900';

    function handleFile(e) {
        const file = e.target.files[0];
        if (file) { video.src = URL.createObjectURL(file); video.pause(); canvas.clear(); }
    }

    function changeRes(type) {
        const cont = document.getElementById('video-container');
        if (type === 'yt') {
            cont.className = 'res-yt'; canvas.setWidth(854); canvas.setHeight(480);
        } else {
            cont.className = 'res-movil'; canvas.setWidth(360); canvas.setHeight(640);
        }
        document.getElementById('res-yt-btn').classList.toggle('active', type === 'yt');
        document.getElementById('res-movil-btn').classList.toggle('active', type === 'movil');
    }

    function togglePlay() { 
        video.paused ? video.play() : video.pause(); 
        document.getElementById('play-btn').innerText = video.paused ? "▶️ PLAY" : "⏸️ PAUSA";
    }

    document.getElementById('seek-bar').oninput = (e) => { video.currentTime = (e.target.value / 100) * video.duration; };
    video.ontimeupdate = () => { document.getElementById('seek-bar').value = (video.currentTime / video.duration) * 100 || 0; };

    function setColor(color, el) {
        currentColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');
    }

    function setMode(m) {
        currentMode = m;
        canvas.isDrawingMode = (m === 'pencil');
        if(canvas.isDrawingMode) { canvas.freeDrawingBrush.width = 5; canvas.freeDrawingBrush.color = currentColor; }
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
    }

    function deleteSelected() {
        canvas.getActiveObjects().forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject().renderAll();
    }

    function takeSnapshot() {
        const cont = document.getElementById('video-container');
        const temp = document.createElement('canvas');
        temp.width = canvas.width; temp.height = canvas.height;
        const ctx = temp.getContext('2d');
        ctx.drawImage(video, 0, 0, temp.width, temp.height);
        ctx.drawImage(canvas.getElement(), 0, 0);
        const link = document.createElement('a');
        link.download = 'analisis.png'; link.href = temp.toDataURL(); link.click();
    }

    let isDown, origX, origY, activeObj, head;
    canvas.on('mouse:down', function(o) {
        if (currentMode === 'select' || currentMode === 'pencil') return;
        let p = canvas.getPointer(o.e);
        if (currentMode === 'text') {
            canvas.add(new fabric.IText('NOMBRE', { left: p.x, top: p.y, fontSize: 24, fill: currentColor, fontWeight: 'bold' }));
            setMode('select'); return;
        }
        isDown = true; origX = p.x; origY = p.y;
        if (currentMode === 'circle') {
            activeObj = new fabric.Circle({ left:origX, top:origY, radius:1, stroke:currentColor, strokeWidth:5, fill:'transparent' });
            canvas.add(activeObj);
        } else if (currentMode === 'arrow') {
            activeObj = new fabric.Line([origX, origY, origX, origY], { stroke: currentColor, strokeWidth: 6 });
            head = new fabric.Triangle({ width:18, height:18, fill:currentColor, originX:'center', originY:'center' });
            canvas.add(activeObj, head);
        }
    });

    canvas.on('mouse:move', function(o) {
        if (!isDown) return;
        let p = canvas.getPointer(o.e);
        if (currentMode === 'circle') activeObj.set({ radius: Math.abs(origX - p.x) / 2 });
        else if (currentMode === 'arrow') {
            activeObj.set({ x2: p.x, y2: p.y });
            let ang = Math.atan2(p.y - origY, p.x - origX) * 180 / Math.PI;
            head.set({ left: p.x, top: p.y, angle: ang + 90 });
        }
        canvas.renderAll();
    });

    canvas.on('mouse:up', () => { isDown = false; if(currentMode !== 'pencil') setMode('select'); });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    });
</script>
</body>
</html>
