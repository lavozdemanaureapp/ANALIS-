<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Voz de Manaure - PWA Táctica Pro</title>
    <style>
        :root { --ama: #edb900; --negro: #1a1a1a; --gris: #333; }
        body { font-family: Arial; background: var(--negro); color: white; margin: 0; text-align: center; }

        /* PANEL SUPERIOR */
        .toolbar { background: var(--ama); padding: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; sticky; top: 0; z-index: 100; }
        .btn-t { background: black; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* SELECTOR DE COLORES */
        .color-picker { display: flex; gap: 5px; align-items: center; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 5px; }
        .c-box { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .c-box.active { border-color: black; }

        /* AREA DE VIDEO Y DIBUJO */
        #canvas-wrap { margin: 20px auto; background: black; position: relative; transition: 0.4s; border: 2px solid var(--gris); }
        .modo-yt { width: 85%; aspect-ratio: 16 / 9; }
        .modo-cel { width: 360px; height: 640px; border: 4px solid var(--ama) !important; }

        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: crosshair; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-t" onclick="setTool('circle')">⭕ Círculo</button>
        <button class="btn-t" onclick="setTool('arrow')">↗️ Flecha</button>
        <button class="btn-t" onclick="setTool('double')">↔️ Doble</button>
        <button class="btn-t" onclick="setTool('line')">➖ Línea</button>
        <button class="btn-t" onclick="setTool('text')">TXT</button>

        <div class="color-picker">
            <div class="c-box active" style="background: white;" onclick="setColor('white', this)"></div>
            <div class="c-box" style="background: #edb900;" onclick="setColor('#edb900', this)"></div>
            <div class="c-box" style="background: #ff0000;" onclick="setColor('#ff0000', this)"></div>
        </div>

        <button class="btn-t" style="background: red;" onclick="clearS()">🗑️ Limpiar</button>
        |
        <button class="btn-t" onclick="resz('yt')">📺 YouTube</button>
        <button class="btn-t" onclick="resz('cel')">📱 Móvil</button>
    </div>

    <div id="canvas-wrap" class="modo-yt">
        <video id="v" src="video_tachira.mp4" controls></video>
        <svg id="s"></svg>
    </div>

    <script>
        let tool = 'arrow';
        let color = 'white';

        function setTool(t) { tool = t; }
        
        function setColor(c, el) { 
            color = c; 
            document.querySelectorAll('.c-box').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function clearS() { document.getElementById('s').innerHTML = ''; }

        function resz(m) {
            const w = document.getElementById('canvas-wrap');
            w.className = (m === 'yt') ? 'modo-yt' : 'modo-cel';
            clearS();
        }

        // Aquí pégas la lógica de dibujo (mousedown, mousemove, mouseup) 
        // usando la variable 'color' para el stroke o fill de las figuras.
    </script>
</body>
</html>
