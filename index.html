<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Voz de Manaure - Táctica Final v13.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --ama: #edb900; --negro: #1a1a1a; --verde: #27ae60; --rojo: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--negro); color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        .toolbar { background: var(--ama); padding: 10px; display: flex; justify-content: center; gap: 8px; align-items: center; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn-t { background: black; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn-t.active { background: white; color: black; box-shadow: 0 0 8px rgba(255,255,255,0.6); }
        
        #canvas-wrapper { position: relative; background: #000; border: 2px solid #444; margin: auto; }
        .modo-youtube { width: 854px; height: 480px; }
        .modo-celular { width: 360px; height: 640px; border: 4px solid var(--ama) !important; }

        /* Video oculto pero funcional */
        #v-tachira { position: absolute; visibility: hidden; pointer-events: none; }
        
        .video-controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); display: flex; padding: 10px; gap: 10px; z-index: 20; align-items: center; box-sizing: border-box; }
        #seek-bar { flex-grow: 1; accent-color: var(--ama); }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="file-input" accept="video/*" style="display:none" onchange="handleFile(event)">
    <button class="btn-t" style="background:var(--verde)" onclick="document.getElementById('file-input').click()">📁 SELECCIONAR JUGADA</button>
    
    <button id="btn-pencil" class="btn-t tool-btn" onclick="setMode('pencil')">✏️ LIBRE</button>
    <button id="btn-circle" class="btn-t tool-btn" onclick="setMode('circle')">⭕ ANILLO</button>
    <button id="btn-arrow" class="btn-t tool-btn" onclick="setMode('arrow')">↗️ FLECHA TV</button>

    <button id="btn-rec" class="btn-t" style="background:#444" onclick="toggleRecording()">🔴 GRABAR</button>
    <button class="btn-t" style="background:var(--rojo)" onclick="canvas.clear();">🗑️ LIMPIAR</button>
    |
    <button id="btn-yt" class="btn-t active" onclick="resize('youtube')">📺 YT</button>
    <button id="btn-cel" class="btn-t" onclick="resize('celular')">📱 MÓVIL</button>
</div>

<div id="main-container" style="flex-grow:1; display:flex;">
    <div id="canvas-wrapper" class="modo-youtube">
        <video id="v-tachira" loop muted crossorigin="anonymous"></video>
        <canvas id="tactic-canvas"></canvas>
        <div class="video-controls">
            <button class="btn-t" onclick="skip(-5)">⏪ 5s</button>
            <button class="btn-t" onclick="togglePlay()">⏯️ PLAY/PAUSA</button>
            <button class="btn-t" onclick="skip(5)">5s ⏩</button>
            <button class="btn-t" onclick="setSpeed(0.5)">🐢 0.5x</button>
            <button class="btn-t" onclick="setSpeed(1)">🏃 1x</button>
            <input type="range" id="seek-bar" value="0">
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('v-tachira');
    const canvas = new fabric.Canvas('tactic-canvas', { selection: false });
    let currentMode = 'pencil';
    let mediaRecorder, recordedChunks = [];

    // Función para manejar la carga del video
    function handleFile(e) {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            video.src = url;
            video.load();
            video.onloadeddata = () => {
                video.play();
                requestAnimationFrame(render);
            };
        }
    }

    function togglePlay() { video.paused ? video.play() : video.pause(); }
    function skip(t) { video.currentTime += t; }
    function setSpeed(s) { video.playbackRate = s; }

    function resize(m) {
        const wrap = document.getElementById('canvas-wrapper');
        wrap.className = (m === 'youtube') ? 'modo-youtube' : 'modo-celular';
        setTimeout(() => { 
            canvas.setWidth(wrap.clientWidth); 
            canvas.setHeight(wrap.clientHeight); 
        }, 300);
    }

    function setMode(m) {
        currentMode = m;
        canvas.isDrawingMode = (m === 'pencil');
        if(canvas.isDrawingMode) {
            canvas.freeDrawingBrush.width = 5;
            canvas.freeDrawingBrush.color = '#edb900';
        }
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
    }

    // Lógica de Grabación
    async function toggleRecording() {
        const recBtn = document.getElementById('btn-rec');
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            recBtn.innerText = "🔴 GRABAR";
            recBtn.style.background = "#444";
        } else {
            recordedChunks = [];
            const stream = document.querySelector('canvas').captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'analisis_manaure.webm'; a.click();
            };
            mediaRecorder.start();
            recBtn.innerText = "⏹️ PARAR";
            recBtn.style.background = "red";
        }
    }

    // Dibujo de Círculos y Flechas Pro
    let isDown, origX, origY, activeLine, activeHead;
    canvas.on('mouse:down', function(o) {
        if (currentMode === 'pencil' || currentMode === 'select') return;
        isDown = true;
        let pointer = canvas.getPointer(o.e);
        origX = pointer.x; origY = pointer.y;

        if (currentMode === 'circle') {
            const circle = new fabric.Circle({ left: origX, top: origY, radius: 1, stroke: '#edb900', strokeWidth: 5, fill: 'rgba(237,185,0,0.2)', selectable: false });
            canvas.add(circle);
            activeLine = circle;
        } else if (currentMode === 'arrow') {
            activeLine = new fabric.Line([origX, origY, origX, origY], { stroke: 'white', strokeWidth: 6, selectable: false });
            activeHead = new fabric.Triangle({ width: 20, height: 20, fill: 'white', left: origX, top: origY, originX: 'center', originY: 'center', selectable: false });
            canvas.add(activeLine, activeHead);
        }
    });

    canvas.on('mouse:move', function(o) {
        if (!isDown || currentMode === 'pencil') return;
        let pointer = canvas.getPointer(o.e);
        if (currentMode === 'circle') {
            activeLine.set({ radius: Math.abs(origX - pointer.x) / 2 });
        } else if (currentMode === 'arrow') {
            activeLine.set({ x2: pointer.x, y2: pointer.y });
            let angle = Math.atan2(pointer.y - origY, pointer.x - origX) * 180 / Math.PI;
            activeHead.set({ left: pointer.x, top: pointer.y, angle: angle + 90 });
        }
        canvas.renderAll();
    });

    canvas.on('mouse:up', () => isDown = false);

    // RENDERIZADO CONTINUO (Video -> Canvas)
    function render() {
        if (!video.paused || video.readyState >= 2) {
            const img = new fabric.Image(video, { left: 0, top: 0, width: canvas.width, height: canvas.height, objectFit: 'contain' });
            canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
        }
        requestAnimationFrame(render);
    }

    window.onload = () => {
        const wrap = document.getElementById('canvas-wrapper');
        canvas.setWidth(wrap.clientWidth);
        canvas.setHeight(wrap.clientHeight);
        setMode('pencil');
    };

    video.ontimeupdate = () => { document.getElementById('seek-bar').value = (video.currentTime / video.duration) * 100 || 0; };
</script>
</body>
</html>
