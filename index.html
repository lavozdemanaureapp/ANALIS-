<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manaure Tactical PRO v44.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root { --ama: #edb900; --negro: #111; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .toolbar { background: var(--negro); padding: 10px; display: flex; justify-content: center; gap: 8px; border-bottom: 2px solid var(--ama); flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn-t { background: #222; color: white; border: 1px solid #444; padding: 8px 12px; cursor: pointer; font-size: 11px; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .btn-t:hover { border-color: var(--ama); }
        .btn-t.active { background: var(--ama); color: black; box-shadow: 0 0 10px var(--ama); }
        #video-container { position: relative; width: 854px; height: 480px; margin: auto; border: 3px solid #333; background: #000; }
        video { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; object-fit: contain; }
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 10; }
        .controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); display: flex; padding: 10px; gap: 10px; z-index: 100; align-items: center; box-sizing: border-box; }
        input[type=range] { flex-grow: 1; accent-color: var(--ama); cursor: pointer; }
        .color-p { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="v-in" style="display:none" onchange="h_video(event)">
    <input type="file" id="img-in" style="display:none" accept="image/*" onchange="h_image(event)">
    
    <button class="btn-t" style="background:#27ae60" onclick="document.getElementById('v-in').click()">📁 VIDEO</button>
    <button class="btn-t" style="background:#2980b9" onclick="document.getElementById('img-in').click()">🖼️ IMAGEN</button>
    
    <button id="b-sel" class="btn-t tool-btn active" onclick="setM('select')">🖱️ MOVER</button>
    <button id="b-pla" class="btn-t" onclick="addPlayer()">👤 JUGADOR</button>
    <button id="b-arr" class="btn-t tool-btn" onclick="setM('arrow')">↗️ FLECHA</button>
    <button id="b-tri" class="btn-t tool-btn" onclick="setM('triangle')">🔺 TRIÁNGULO</button>
    <button id="b-are" class="btn-t tool-btn" onclick="setM('area')">🟥 ZONA</button>

    <div style="display:flex; gap:5px; margin: 0 10px; border-left: 1px solid #444; border-right: 1px solid #444; padding: 0 10px;">
        <div class="color-p" style="background:#e74c3c" onclick="setCol('#e74c3c')"></div>
        <div class="color-p" style="background:#edb900" onclick="setCol('#edb900')"></div>
        <div class="color-p" style="background:#ffffff" onclick="setCol('#ffffff')"></div>
    </div>
    
    <button id="rec-btn" class="btn-t" style="background:#c0392b" onclick="toggleR()">🔴 GRABAR</button>
    <button class="btn-t" onclick="canvas.clear()">🗑️ LIMPIAR</button>
</div>

<div style="flex-grow:1; display:flex;">
    <div id="video-container">
        <video id="v" muted playsinline></video>
        <canvas id="c"></canvas>
        <div class="controls">
            <button class="btn-t" onclick="v.paused?v.play():v.pause()">▶️/⏸️</button>
            <button class="btn-t" onclick="v.currentTime -= 2">⏪</button>
            <input type="range" id="seek" value="0" min="0" step="0.1">
            <button class="btn-t" onclick="v.currentTime += 2">⏩</button>
        </div>
    </div>
</div>

<script>
    const v = document.getElementById('v'), canvas = new fabric.Canvas('c', { width: 854, height: 480 }), seek = document.getElementById('seek');
    let mode = 'select', isDown, x, y, active, rec, chunks = [], curC = '#edb900';

    function h_video(e) { const f = e.target.files[0]; if(f) { v.src = URL.createObjectURL(f); v.pause(); canvas.clear(); } }
    
    // FUNCIÓN PARA CARGAR IMÁGENES
    function h_image(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    img.scaleToWidth(150);
                    img.set({ left: 50, top: 50 });
                    canvas.add(img);
                    canvas.setActiveObject(img);
                });
            };
            reader.readAsDataURL(file);
        }
    }

    function setM(m) { mode = m; document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); if(m!=='select') document.getElementById('b-'+m.substring(0,3)).classList.add('active'); }
    function setCol(c) { curC = c; }

    v.addEventListener('loadedmetadata', () => { seek.max = v.duration; });
    v.addEventListener('timeupdate', () => { if(!isDown) seek.value = v.currentTime; });
    seek.addEventListener('input', () => { v.currentTime = seek.value; });

    function addPlayer() {
        let circle = new fabric.Circle({ 
            left: 150, top: 150, radius: 26, stroke: curC, strokeWidth: 3, fill: 'transparent',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 10 })
        });
        let name = new fabric.IText('NOMBRE', { 
            left: 135, top: 215, fontSize: 16, fill: 'white', fontFamily: 'Arial Bold',
            textBackgroundColor: 'rgba(0,0,0,0.7)', padding: 5
        });
        canvas.add(circle, name);
        setM('select');
    }

    canvas.on('mouse:down', (o) => {
        if(mode === 'select' || mode === 'player') return;
        isDown = true; let p = canvas.getPointer(o.e); x = p.x; y = p.y;
        if(mode === 'arrow') {
            let l = new fabric.Line([x, y, x, y], { stroke: curC, strokeWidth: 4 });
            let t = new fabric.Triangle({ width: 15, height: 15, fill: curC, originX: 'center', originY: 'center', selectable: false });
            active = new fabric.Group([l, t], { selectable: true });
            canvas.add(active);
        } else if(mode === 'triangle' || mode === 'area') {
            let Shape = mode === 'triangle' ? fabric.Triangle : fabric.Rect;
            active = new Shape({ left: x, top: y, width: 1, height: 1, fill: curC+'33', stroke: curC, strokeWidth: 2 });
            canvas.add(active);
        }
    });

    canvas.on('mouse:move', (o) => {
        if(!isDown || mode === 'select') return;
        let p = canvas.getPointer(o.e);
        if(mode === 'arrow') {
            let l = active.item(0); l.set({ x2: p.x, y2: p.y });
            let ang = Math.atan2(p.y - y, p.x - x) * 180 / Math.PI;
            active.item(1).set({ left: p.x, top: p.y, angle: ang + 90 });
            canvas.remove(active); active = new fabric.Group([l, active.item(1)], { selectable: true }); canvas.add(active);
        } else {
            active.set({ width: Math.abs(x - p.x), height: Math.abs(y - p.y), left: Math.min(x, p.x), top: Math.min(y, p.y) });
        }
        canvas.renderAll();
    });

    canvas.on('mouse:up', () => isDown = false);

    async function toggleR() {
        const b = document.getElementById('rec-btn');
        if(rec && rec.state === "recording") { rec.stop(); b.innerText = "🔴 GRABAR"; b.style.background = "#c0392b"; }
        else {
            chunks = [];
            const outC = document.createElement('canvas'); outC.width = 854; outC.height = 480;
            const ctx = outC.getContext('2d');
            function stream() {
                if(rec && rec.state === "recording") {
                    ctx.drawImage(v, 0, 0, 854, 480);
                    ctx.drawImage(canvas.getElement(), 0, 0);
                    requestAnimationFrame(stream);
                }
            }
            const ms = outC.captureStream(30);
            rec = new MediaRecorder(ms, { mimeType: 'video/webm;codecs=vp8' });
            rec.ondataavailable = e => chunks.push(e.data);
            rec.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ANALISIS_MANAURE_FOTO.webm'; a.click();
            };
            stream(); rec.start(); b.innerText = "⏹️ STOP"; b.style.background = "#222";
        }
    }
</script>
</body>
</html>
